name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        release: [R2024b, R2025a, R2025b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
          products: Optimization_Toolbox
      - uses: matlab-actions/run-build@v2
        with:
          tasks: check test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in mmb_run.sh config/*.sh tools/*.sh slurm/*.sh tests/hpc/*.sh tests/shell/*.sh; do
            bash -n "$f"
          done
      - name: Shell tests
        run: |
          for t in tests/shell/*.sh; do
            echo "== $t"
            bash "$t"
          done
